<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Título - Cobrança IFMT</title>

    <!-- Bootstrap 5 (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #f8f9fa 100%);
            min-height: 100vh;
        }

        .navbar-ifmt {
            background: linear-gradient(90deg, #006633 0%, #00994d 100%);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .navbar-ifmt .navbar-brand {
            color: #fff;
            font-weight: 600;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-form {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .card-form .card-header {
            background: linear-gradient(90deg, #006633 0%, #00994d 100%);
            color: #fff;
            padding: 1.5rem 2rem;
            border: none;
        }

        .card-form .card-header h4 {
            margin: 0;
            font-weight: 600;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-form .card-body {
            padding: 2.5rem 2rem;
        }

        .form-label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #dee2e6;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #00994d;
            box-shadow: 0 0 0 0.2rem rgba(0, 153, 77, 0.15);
        }

        .input-group-text {
            background: #f1f8f4;
            border: 1.5px solid #dee2e6;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #006633;
            font-weight: 600;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .input-group:focus-within .input-group-text {
            border-color: #00994d;
        }

        .btn-ifmt {
            background: linear-gradient(90deg, #006633 0%, #00994d 100%);
            border: none;
            color: #fff;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.25s;
            box-shadow: 0 4px 12px rgba(0, 153, 77, 0.25);
        }

        .btn-ifmt:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 153, 77, 0.35);
            color: #fff;
        }

        .btn-cancel {
            background: #fff;
            border: 1.5px solid #dee2e6;
            color: #6c757d;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #f8f9fa;
            border-color: #adb5bd;
            color: #495057;
        }

        .form-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #f1f8f4;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-ifmt mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/ifmtlogo.png" width="45" height="45" alt="IFMT"
                     style="background:#fff; border-radius:10px; padding:4px;">
                <span>Cobrança IFMT</span>
            </a>
            <span class="text-white-50 small d-none d-md-inline">
                <i class="bi bi-receipt"></i> Sistema de Gestão de Títulos
            </span>
        </div>
    </nav>

    <!-- Mensagem de sucesso -->
    <div class="container mt-3" th:if="${!#strings.isEmpty(mensagem)}">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${mensagem}">Salvo com sucesso!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Formulário -->
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card card-form">

                    <div class="card-header">
                        <h4>
                            <i class="bi bi-file-earmark-plus"></i>
                            Novo Título
                        </h4>
                    </div>

                    <div class="card-body">

                        <form action="/titulos" method="POST" th:object="${titulo}">

                            <!-- Campo hidden para o código (necessário para edição futura) -->
                            <input type="hidden" th:field="*{codigo}">

                            <div class="form-section-title">Informações do Título</div>

                            <!-- Descrição -->
                            <div class="mb-4">
                                <label for="descricao" class="form-label">
                                    <i class="bi bi-card-text text-success"></i> Descrição
                                </label>
                                <input type="text" class="form-control" id="descricao"
                                       placeholder="Ex: Pagamento de fornecedor de material"
                                       th:field="*{descricao}" required>
                            </div>

                            <div class="row">
                                <!-- Data de Vencimento -->
                                <div class="col-md-6 mb-4">
                                    <label for="dataVencimento" class="form-label">
                                        <i class="bi bi-calendar-event text-success"></i> Data de Vencimento
                                    </label>
                                    <input type="text" class="form-control" id="dataVencimento"
                                           placeholder="dd/mm/aaaa"
                                           th:field="*{dataVencimento}" required>
                                </div>

                                <!-- Valor -->
                                <div class="col-md-6 mb-4">
                                    <label for="valor" class="form-label">
                                        <i class="bi bi-currency-dollar text-success"></i> Valor
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="text" class="form-control" id="valor"
                                               placeholder="0,00"
                                               th:field="*{valor}" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Status (populado dinamicamente) -->
                            <div class="mb-4">
                                <label for="status" class="form-label">
                                    <i class="bi bi-tag text-success"></i> Status
                                </label>
                                <select class="form-select" id="status" th:field="*{status}">
                                    <option th:each="status : ${todosStatusTitulo}"
                                            th:value="${status}"
                                            th:text="${status.descricao}">
                                    </option>
                                </select>
                            </div>

                            <!-- Botões -->
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/titulos/novo" class="btn btn-cancel">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-ifmt">
                                    <i class="bi bi-check-lg"></i> Salvar Título
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

                <!-- Rodapé -->
                <p class="text-center text-muted small mt-4 mb-0">
                    <i class="bi bi-mortarboard"></i> IFMT — Instituto Federal de Mato Grosso
                </p>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
